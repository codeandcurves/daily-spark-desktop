<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Spark 2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font-family:"Comic Sans MS","Segoe Print","Trebuchet MS",sans-serif;color:#111}.card{height:100%;background:#fff;border:3px solid #111;border-radius:14px;padding:10px 12px;box-shadow:5px 5px 0 #111;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:7px}.bolt{background:#ffd928;border:2px solid #111;border-radius:7px;padding:1px 6px;font-weight:900}.brand{font-size:12px;font-weight:900}.kind{margin-left:3px;background:#ffd928;border:2px solid #111;border-radius:12px;padding:2px 8px;font-size:9px;font-weight:900;text-transform:uppercase}.x{margin-left:auto;border:0;background:transparent;font-size:18px;font-weight:900;cursor:pointer}.text{font-family:"Segoe UI",sans-serif;font-size:12px;line-height:1.32;font-weight:650;margin:9px 2px 5px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.bottom{margin-top:auto;display:flex;align-items:center;gap:6px}.context{font:9px "Segoe UI",sans-serif;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.btn{border:2px solid #111;border-radius:9px;background:#fff;padding:3px 8px;font-size:9px;font-weight:900;cursor:pointer}.btn.primary{background:#ffd928}</style></head><body><div class="card" id="card"><div class="top"><span class="bolt">⚡</span><span class="brand">DAILY SPARK</span><span class="kind" id="kind">IDEA!</span><button class="x" id="close">×</button></div><div class="text" id="text">Your next useful thought will appear here.</div><div class="bottom"><div class="context" id="context">Private · stored on this PC</div><button class="btn" id="later">LATER!</button><button class="btn primary" id="done">GOT IT!</button><button class="btn" id="next">NEXT!</button></div></div><script>const $=id=>document.getElementById(id);function render(s){if(!s)return;$('kind').textContent=(s.kind||'Spark').toUpperCase()+'!';$('text').textContent=s.text||'';$('context').textContent=s.context||'Private · stored locally'}$('close').onclick=()=>sparkDesktop.close();$('next').onclick=async()=>render(await sparkDesktop.another());$('later').onclick=async()=>render(await sparkDesktop.later());$('done').onclick=async()=>render(await sparkDesktop.done());$('card').onmouseenter=()=>sparkDesktop.hover(true);$('card').onmouseleave=()=>sparkDesktop.hover(false);sparkDesktop.onDisplay(render);window.addEventListener('DOMContentLoaded',async()=>render(await sparkDesktop.another()));</script></body></html>
