<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Daily Spark</title><style>
:root{--paper:#fbf7ee;--ink:#24231f;--muted:#777267;--line:#e3dccf;--accent:#a66542}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Segoe UI,system-ui,sans-serif;background:transparent;color:var(--ink);padding:0}.card{height:100%;background:linear-gradient(145deg,#fffdf8,#f6efe3);border:1px solid var(--line);border-radius:18px;padding:15px 17px 13px;box-shadow:0 18px 45px #0002;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-family:Georgia,serif;font-weight:700;font-size:14px;letter-spacing:.02em}.brand span{color:#b17b3d}.x{border:0;background:transparent;font-size:18px;color:var(--muted);cursor:pointer}.tag{margin-top:7px;font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}.text{font-family:Georgia,serif;font-size:18px;line-height:1.28;margin:8px 0 6px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta b{color:var(--ink)}.bottom{margin-top:auto;display:flex;align-items:center;gap:7px}.btn{border:1px solid var(--line);background:#fffaf2;border-radius:999px;padding:6px 10px;font-size:10.5px;cursor:pointer;color:var(--ink)}.another{margin-left:auto;background:var(--ink);color:white;border-color:var(--ink);font-weight:600}.status{font-size:9px;color:#9a9388;margin-top:5px}.settings{position:absolute;inset:0;background:#fbf7ee;padding:16px;display:none}.settings.on{display:block}.settings h3{font-family:Georgia,serif;margin:0 0 10px}.topics{display:flex;gap:5px;flex-wrap:wrap}.topic{font-size:9px;border:1px solid var(--line);border-radius:99px;padding:5px 7px;background:white}.topic.on{background:var(--ink);color:white}.row{display:flex;gap:7px;margin-top:12px}.row .btn{font-size:10px}</style></head><body><div class="card" id="card"><div class="top"><div class="brand"><span>✦</span> Daily Spark</div><button class="x" id="close">×</button></div><div class="tag" id="tag">TODAY'S SPARK</div><div class="text" id="text">A useful thought is on its way.</div><div class="meta"><b id="author"></b><span id="source"></span></div><div class="bottom"><button class="btn" id="save">♡ Save</button><button class="btn" id="open">↗ Source</button><button class="btn" id="prefs">⚙</button><button class="btn another" id="another">Another →</button></div><div class="status" id="status">Random desk spark · closes automatically</div></div><div class="settings" id="settings"><div class="top"><h3>Topics</h3><button class="x" id="back">×</button></div><div class="topics" id="topics"></div><div class="row"><button class="btn" id="savePrefs">Save</button></div><div class="status">Popups appear randomly about every 2–4 hours while Daily Spark is running.</div></div><script>
const fallback=[
{topic:'AI Trends',text:'AI systems become more useful when models are paired with reliable tools, context, evaluation and clear feedback loops.',author:'Daily Spark',source:'Curated insight',url:''},
{topic:'Motivation',text:'The work becomes lighter when you focus on the next repeatable action instead of the entire distance ahead.',author:'Daily Spark',source:'Curated insight',url:''},
{topic:'MMA',text:'Train the fundamentals until good decisions still appear when you are tired, pressured and uncomfortable.',author:'Daily Spark',source:'MMA mindset',url:''},
{topic:'Physical Fitness',text:'Fitness compounds through ordinary sessions completed consistently, not occasional perfect workouts.',author:'Daily Spark',source:'Fitness insight',url:''},
{topic:'Art & Music',text:'Make room for unfinished ideas. A sketch, rhythm or fragment can become meaningful when revisited with new experience.',author:'Daily Spark',source:'Creative prompt',url:''},
{topic:'Upcoming Tasks',text:'Choose one unfinished task that would make the rest of today easier, and give it ten focused minutes.',author:'Daily Spark',source:'Task prompt',url:''}
];
let current=null,favs=JSON.parse(localStorage.getItem('sparkFavs')||'[]'),topics=['AI Trends','Motivation','MMA','Physical Fitness','Art & Music','Upcoming Tasks'];const $=x=>document.getElementById(x);
async function loadPrefs(){try{const p=await window.sparkDesktop.getPrefs();topics=p.topics||topics}catch{}renderTopics()}
function renderTopics(){$('topics').innerHTML=['AI Trends','Motivation','MMA','Physical Fitness','Art & Music','Upcoming Tasks'].map(t=>`<button class="topic ${topics.includes(t)?'on':''}" data-t="${t}">${t}</button>`).join('');document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>b.classList.toggle('on'))}
async function next(){let pool=fallback.filter(x=>topics.includes(x.topic));if(!pool.length)pool=fallback;let q=null;if(topics.includes('Motivation')&&Math.random()<.45){$('status').textContent='Checking The Quotations Page…';try{q=await window.sparkDesktop.getQuote()}catch{}}current=q?{topic:'Motivation',text:q.text,author:q.author,source:q.source,url:q.url}:pool[Math.floor(Math.random()*pool.length)];$('tag').textContent=current.topic.toUpperCase();$('text').textContent=(current.topic==='Motivation'&&q?'“':'')+current.text+(current.topic==='Motivation'&&q?'”':'');$('author').textContent=current.author||'';$('source').textContent=(current.author?' · ':'')+(current.source||'');$('open').style.display=current.url?'block':'none';$('status').textContent=q?'Live quote · The Quotations Page':'Random desk spark · closes automatically'}
$('close').onclick=()=>window.sparkDesktop.close();$('another').onclick=next;$('open').onclick=()=>current?.url&&window.sparkDesktop.openUrl(current.url);$('save').onclick=()=>{if(current){favs.push({...current,savedAt:new Date().toISOString()});localStorage.setItem('sparkFavs',JSON.stringify(favs));$('save').textContent='♥ Saved';setTimeout(()=>$('save').textContent='♡ Save',1200)}};$('prefs').onclick=()=>{$('settings').classList.add('on');renderTopics()};$('back').onclick=()=>$('settings').classList.remove('on');$('savePrefs').onclick=async()=>{topics=[...document.querySelectorAll('.topic.on')].map(x=>x.dataset.t);if(!topics.length)return;await window.sparkDesktop.savePrefs({topics});$('settings').classList.remove('on');next()};$('card').onmouseenter=()=>window.sparkDesktop.hover(true);$('card').onmouseleave=()=>window.sparkDesktop.hover(false);window.addEventListener('DOMContentLoaded',async()=>{await loadPrefs();next()});
</script></body></html>
