<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Daily Spark</title><style>
:root{--paper:#fbf7ef;--ink:#211f1b;--muted:#7c766c;--line:#e6ded0;--accent:#a8653f;--gold:#b77a35}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Segoe UI",system-ui,sans-serif;background:transparent;color:var(--ink)}.card{height:100%;background:linear-gradient(145deg,#fffdf8 0%,#f8f1e6 100%);border:1px solid var(--line);border-radius:18px;padding:14px 16px 13px;box-shadow:0 14px 36px #0000001f;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-family:Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.01em}.brand span{color:var(--gold);margin-right:3px}.x{width:26px;height:26px;border:0;border-radius:50%;background:transparent;font-size:17px;line-height:24px;color:var(--muted);cursor:pointer}.x:hover{background:#eee5d8;color:var(--ink)}.tag{margin-top:5px;font-size:9px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:var(--accent)}.text{font-family:Georgia,serif;font-size:17px;line-height:1.3;margin:7px 0 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.author{font-size:10.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sourceLine{margin-top:2px;font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sourceLine.live{color:#8d6b4b}.bottom{margin-top:auto;display:flex;align-items:center;gap:7px;padding-top:8px;border-top:1px solid #eee6da}.btn{border:1px solid var(--line);background:#fffaf3;border-radius:999px;padding:6px 10px;font-size:10.5px;cursor:pointer;color:var(--ink);transition:.12s}.btn:hover{transform:translateY(-1px);background:#fff}.another{margin-left:auto;background:var(--ink);color:white;border-color:var(--ink);font-weight:650;padding-left:13px;padding-right:13px}.another:hover{background:#35322d}.saved{background:#f3e6d5}.status{font-size:8.5px;color:#9b9388;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><div class="card" id="card"><div class="top"><div class="brand"><span>✦</span> Daily Spark</div><button class="x" id="close" aria-label="Close">×</button></div><div class="tag" id="tag">TODAY'S SPARK</div><div class="text" id="text">A useful thought is on its way.</div><div class="author" id="author"></div><div class="sourceLine" id="source"></div><div class="bottom"><button class="btn" id="save">♡ Save</button><button class="btn" id="open">↗ Source</button><button class="btn another" id="another">Another →</button></div><div class="status" id="status">Random desk spark · closes automatically</div></div><script>
const fallback=[
{topic:'AI Trends',text:'AI systems become more useful when models are paired with reliable tools, context, evaluation and clear feedback loops.',author:'Daily Spark',source:'Curated AI insight',url:''},
{topic:'Motivation',text:'The work becomes lighter when you focus on the next repeatable action instead of the entire distance ahead.',author:'Daily Spark',source:'Curated motivation',url:''},
{topic:'MMA',text:'Train the fundamentals until good decisions still appear when you are tired, pressured and uncomfortable.',author:'Daily Spark',source:'MMA mindset',url:''},
{topic:'Physical Fitness',text:'Fitness compounds through ordinary sessions completed consistently, not occasional perfect workouts.',author:'Daily Spark',source:'Fitness insight',url:''},
{topic:'Art & Music',text:'Make room for unfinished ideas. A sketch, rhythm or fragment can become meaningful when revisited with new experience.',author:'Daily Spark',source:'Creative prompt',url:''},
{topic:'Upcoming Tasks',text:'Choose one unfinished task that would make the rest of today easier, and give it ten focused minutes.',author:'Daily Spark',source:'Task prompt',url:''}
];
let current=null,favs=JSON.parse(localStorage.getItem('sparkFavs')||'[]'),topics=['AI Trends','Motivation','MMA','Physical Fitness','Art & Music','Upcoming Tasks'];const $=x=>document.getElementById(x);
async function loadPrefs(){try{const p=await window.sparkDesktop.getPrefs();topics=p.topics||topics}catch{}}
function cleanText(s=''){const d=document.createElement('textarea');d.innerHTML=s;return d.value.replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()}
async function next(){let pool=fallback.filter(x=>topics.includes(x.topic));if(!pool.length)pool=fallback;let q=null;if(topics.includes('Motivation')&&Math.random()<.5){$('status').textContent='Finding a suitable quote…';try{q=await window.sparkDesktop.getQuote()}catch{}}current=q?{topic:'Motivation',text:cleanText(q.text),author:cleanText(q.author),source:'The Quotations Page',url:q.url}:pool[Math.floor(Math.random()*pool.length)];$('tag').textContent=current.topic.toUpperCase();$('text').textContent=q?'“'+current.text+'”':current.text;$('author').textContent=current.author||'';$('source').textContent=current.source||'';$('source').classList.toggle('live',!!q);$('open').style.display=current.url?'block':'none';$('status').textContent=q?'Live source · quotationspage.com':'Daily Spark · curated locally'}
$('close').onclick=()=>window.sparkDesktop.close();$('another').onclick=next;$('open').onclick=()=>current?.url&&window.sparkDesktop.openUrl(current.url);$('save').onclick=()=>{if(!current)return;favs.push({...current,savedAt:new Date().toISOString()});localStorage.setItem('sparkFavs',JSON.stringify(favs));$('save').textContent='♥ Saved';$('save').classList.add('saved');setTimeout(()=>{$('save').textContent='♡ Save';$('save').classList.remove('saved')},1200)};$('card').onmouseenter=()=>window.sparkDesktop.hover(true);$('card').onmouseleave=()=>window.sparkDesktop.hover(false);window.addEventListener('DOMContentLoaded',async()=>{await loadPrefs();next()});
</script></body></html>
