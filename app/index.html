<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Daily Spark</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Segoe UI",system-ui,sans-serif;background:transparent;color:#24221e}.card{height:100%;background:#fffdf9;border:1px solid #dedbd4;border-radius:12px;padding:11px 13px 10px;box-shadow:0 8px 28px #00000024;display:flex;flex-direction:column}.top{display:flex;align-items:center}.spark{width:25px;height:25px;border-radius:7px;background:#292721;color:#f2c578;display:grid;place-items:center;font-size:13px;margin-right:8px}.brand{font-weight:650;font-size:12px}.kind{font-size:9px;color:#777268;margin-left:7px;text-transform:uppercase;letter-spacing:.08em}.x{margin-left:auto;border:0;background:transparent;color:#777;font-size:17px;cursor:pointer;width:24px;height:24px;border-radius:5px}.x:hover{background:#f0ede7}.text{font-size:13.5px;line-height:1.36;font-weight:500;margin:10px 3px 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.context{font-size:9.5px;color:#817b72;margin:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom{margin-top:auto;display:flex;align-items:center;border-top:1px solid #eeeae3;padding-top:7px}.hint{font-size:9px;color:#989188}.action{margin-left:auto;border:0;background:transparent;font-size:10px;font-weight:650;color:#5d5a54;cursor:pointer;padding:4px 7px;border-radius:5px}.action:hover{background:#f2eee8}</style></head><body><div class="card" id="card"><div class="top"><div class="spark">✦</div><div class="brand">Daily Spark</div><div class="kind" id="kind">QUICK THOUGHT</div><button class="x" id="close">×</button></div><div class="text" id="text"></div><div class="context" id="context"></div><div class="bottom"><span class="hint">For you · from your current themes</span><button class="action" id="another">Another →</button></div></div><script>
const sparks=[
{kind:'Continue',text:'You were shaping Daily Spark into a personal companion rather than a quote app. The next useful step is making conversation capture effortless.',context:'Daily Spark · project follow-up'},
{kind:'Idea',text:'A good proactive assistant should learn when not to interrupt. Quiet timing may become as important as personalization itself.',context:'AI UX · idea to revisit'},
{kind:'Reminder',text:'One thing still pending: connect useful conversation takeaways to Daily Spark so they can return later instead of disappearing with the chat.',context:'Daily Spark · pending'},
{kind:'Suggestion',text:'Keep the next improvement small: make one Spark genuinely useful before adding dashboards, feeds or more settings.',context:'Product building · suggestion'},
{kind:'Motivation',text:'You do not need to finish the whole idea today. Move one part from discussion into something you can actually use.',context:'Progress · motivation'},
{kind:'Routine',text:'Need a reset? Pick one priority, give it 25 focused minutes, take a short break, then decide what deserves the next block.',context:'Focus · simple routine'},
{kind:'Food idea',text:'For a simple meal, start with a protein source, add vegetables, then choose a moderate portion of your usual carbohydrate.',context:'Everyday · general food idea'},
{kind:'Talk',text:'Interesting question from this project: what should an AI remember because it matters later, and what should simply disappear?',context:'Reflection · from your recent themes'}
];
let last=-1;const $=id=>document.getElementById(id);function next(){let i;if(sparks.length===1)i=0;else do{i=Math.floor(Math.random()*sparks.length)}while(i===last);last=i;const s=sparks[i];$('kind').textContent=s.kind.toUpperCase();$('text').textContent=s.text;$('context').textContent=s.context}$('close').onclick=()=>window.sparkDesktop.close();$('another').onclick=next;$('card').onmouseenter=()=>window.sparkDesktop.hover(true);$('card').onmouseleave=()=>window.sparkDesktop.hover(false);window.addEventListener('DOMContentLoaded',next);</script></body></html>
