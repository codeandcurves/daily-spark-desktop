<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Spark</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:#24221e;padding:3px}.card{height:126px;background:rgba(255,253,249,.98);border:1px solid rgba(30,28,24,.12);border-radius:11px;padding:9px 10px 8px;box-shadow:0 5px 18px rgba(0,0,0,.18);display:flex;flex-direction:column}.top{display:flex;align-items:center;height:23px}.spark{width:22px;height:22px;border-radius:6px;background:#292721;color:#f2c578;display:grid;place-items:center;font-size:11px;margin-right:7px}.brand{font-weight:650;font-size:11.5px}.kind{font-size:8px;color:#817b72;margin-left:7px;text-transform:uppercase;letter-spacing:.07em;max-width:145px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.x{margin-left:auto;border:0;background:transparent;color:#817b72;font-size:15px;line-height:20px;cursor:pointer;width:22px;height:22px;border-radius:5px}.x:hover{background:#efebe4}.text{font-size:12.25px;line-height:1.32;font-weight:500;margin:7px 2px 4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.bottom{margin-top:auto;display:flex;align-items:center;min-height:20px}.context{font-size:8.5px;color:#8d867c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:245px}.action{margin-left:auto;border:0;background:transparent;font-size:9px;font-weight:650;color:#5d5a54;cursor:pointer;padding:3px 5px;border-radius:4px}.action:hover{background:#f0ece5}</style></head><body><div class="card" id="card"><div class="top"><div class="spark">✦</div><div class="brand">Daily Spark</div><div class="kind" id="kind">FOR YOU</div><button class="x" id="close" aria-label="Close">×</button></div><div class="text" id="text"></div><div class="bottom"><div class="context" id="context"></div><button class="action" id="another">Another →</button></div></div><script>
const seed=[{kind:'Continue',text:'Turn one useful part of your recent conversation into something you can use today.',context:'Conversation follow-up'},{kind:'Idea',text:'A proactive assistant becomes useful when it knows both what to surface and when to stay quiet.',context:'AI UX · idea to revisit'},{kind:'Suggestion',text:'Keep the next improvement small. Make one Spark genuinely useful before adding more features.',context:'Product building'},{kind:'Motivation',text:'Move one part from discussion into something you can actually use today.',context:'Progress'},{kind:'Routine',text:'Pick one priority. Give it 25 focused minutes, pause, then choose the next useful action.',context:'Simple focus routine'}];
let last='';const $=id=>document.getElementById(id);function render(s){$('kind').textContent=(s.kind||'Spark').toUpperCase();$('text').textContent=s.text||'';$('context').textContent=s.context||'For you';last=s.id||s.text}
async function next(){let inbox=[];try{inbox=await window.sparkDesktop.getInbox()}catch{}const pool=inbox.length&&Math.random()<.8?inbox:seed;let choices=pool.filter(x=>(x.id||x.text)!==last);if(!choices.length)choices=pool;render(choices[Math.floor(Math.random()*choices.length)])}
$('close').onclick=()=>window.sparkDesktop.close();$('another').onclick=next;$('card').onmouseenter=()=>window.sparkDesktop.hover(true);$('card').onmouseleave=()=>window.sparkDesktop.hover(false);window.sparkDesktop.onRefresh(next);window.sparkDesktop.onDisplay(render);window.addEventListener('DOMContentLoaded',next);</script></body></html>
